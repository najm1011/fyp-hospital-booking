# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable data.sql for tests
spring.sql.init.mode=never

# JWT Configuration for tests
jwt.secret=dGVzdFNlY3JldEtleUZvclRlc3RpbmdPbmx5RG9Ob3RVc2VJblByb2R1Y3Rpb25FbnZpcm9ubWVudA==
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Email configuration for tests (disabled)
app.email.enabled=false
app.email.from=test@test.com
app.email.from-name=Test System

# CORS configuration for tests
app.cors.allowed-origins=http://localhost:3000

# Disable static resource handling
spring.web.resources.add-mappings=false

# Note: SecurityAutoConfiguration is NOT excluded here because @SpringBootTest
# needs the full security context. @DataJpaTest tests are unaffected as they
# only load JPA beans.
