# =============================================================================
# Hospital Booking System - Production Configuration
# =============================================================================
# Project: Hospital Appointment Booking System
# Student: Najm (2356070)
# Environment: Production
# Database: PostgreSQL
# =============================================================================

# Application Name
spring.application.name=HospitalBookingAPI

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
server.port=8080
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# =============================================================================
# POSTGRESQL DATABASE CONFIGURATION (Production)
# =============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospital_booking}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=HospitalBookingHikariCP
spring.datasource.hikari.connection-test-query=SELECT 1

# =============================================================================
# JPA / HIBERNATE CONFIGURATION
# =============================================================================
# IMPORTANT: Use 'validate' in production - do not auto-create/update schema
spring.jpa.hibernate.ddl-auto=validate

# Disable SQL logging in production
spring.jpa.show-sql=false

# PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Performance optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Second-level cache (if using Ehcache/Redis)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Format and statistics
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.generate_statistics=false

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
# Production logging - WARN level
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.hospitalapp.backend=INFO

# Log to file
logging.file.name=/var/log/hospital-booking/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=300MB

# Log pattern for production
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
# JWT Secret - MUST be set via environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# BCrypt strength
security.password.strength=12

# Security headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# =============================================================================
# EMAIL CONFIGURATION (Production SMTP)
# =============================================================================
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST}

# Email sender details
app.email.from=${EMAIL_FROM:noreply@hospital-booking.com}
app.email.from-name=Hospital Booking System

# =============================================================================
# FILE UPLOAD CONFIGURATION
# =============================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.enabled=true

# Upload directory - use absolute path in production
app.upload.dir=${UPLOAD_DIR:/var/www/hospital-booking/uploads/}

# =============================================================================
# VALIDATION CONFIGURATION
# =============================================================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# =============================================================================
# CORS CONFIGURATION
# =============================================================================
# Production frontend URL - MUST be set via environment variable
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With
app.cors.allow-credentials=true
app.cors.max-age=3600

# =============================================================================
# APPOINTMENT CONFIGURATION
# =============================================================================
app.appointment.slot-duration=30
app.appointment.max-future-days=90
app.appointment.min-cancellation-hours=24
app.appointment.max-upcoming-per-patient=5

# =============================================================================
# RATE LIMITING CONFIGURATION
# =============================================================================
app.ratelimit.auth=5
app.ratelimit.public=100
app.ratelimit.patient=1000
app.ratelimit.doctor=2000
app.ratelimit.admin=5000

# =============================================================================
# APPLICATION METADATA
# =============================================================================
app.name=Hospital Booking System
app.version=1.0.0
app.description=Hospital Appointment Booking System API
app.environment=production

# =============================================================================
# ACTUATOR CONFIGURATION
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# =============================================================================
# PRODUCTION OPTIMIZATIONS
# =============================================================================
# Disable unnecessary features
spring.jmx.enabled=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Jackson optimizations
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# =============================================================================
# SSL/TLS CONFIGURATION (if using embedded Tomcat with SSL)
# =============================================================================
# Uncomment and configure if not using reverse proxy
# server.ssl.enabled=true
# server.ssl.key-store=${SSL_KEYSTORE_PATH}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=tomcat

# =============================================================================
# REQUIRED ENVIRONMENT VARIABLES
# =============================================================================
# DB_HOST              - PostgreSQL database host (e.g., localhost, db.example.com)
# DB_PORT              - PostgreSQL port (default: 5432)
# DB_NAME              - Database name (default: hospital_booking)
# DB_USERNAME          - Database username
# DB_PASSWORD          - Database password
# JWT_SECRET           - JWT signing secret (min 256 bits)
# JWT_EXPIRATION       - Token expiration in milliseconds (optional)
# SMTP_HOST            - SMTP server host
# SMTP_PORT            - SMTP port (default: 587)
# SMTP_USERNAME        - SMTP username
# SMTP_PASSWORD        - SMTP password
# EMAIL_FROM           - Sender email address
# CORS_ALLOWED_ORIGINS - Allowed frontend URLs (comma-separated)
# UPLOAD_DIR           - File upload directory path
# =============================================================================
