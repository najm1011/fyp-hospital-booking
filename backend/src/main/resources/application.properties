# =============================================================================
# Hospital Booking System - Application Configuration
# =============================================================================
# Project: Hospital Appointment Booking System
# Student: Najm (2356070)
# Environment: Development
# Database: H2 (In-Memory)
# =============================================================================

# Application Name
spring.application.name=HospitalBookingAPI

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# =============================================================================
# H2 DATABASE CONFIGURATION (Development)
# =============================================================================
# Use H2 in-memory database for development
spring.datasource.url=jdbc:h2:mem:hospital_booking_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# =============================================================================
# JPA / HIBERNATE CONFIGURATION
# =============================================================================
# Hibernate DDL auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=create-drop

# SQL Initialization (load data.sql after schema creation)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true

# Use SQL comments in logs
spring.jpa.properties.hibernate.use_sql_comments=true

# Hibernate dialect for H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Enable batch processing
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Enable second-level cache
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Show parameter values in SQL logs
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
# Root logging level
logging.level.root=INFO

# Spring Framework logs
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Hibernate logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Application logs
logging.level.com.hospitalapp.backend=DEBUG

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
# JWT Secret Key (Base64 encoded, minimum 256 bits for HS256)
# CHANGE IN PRODUCTION! Generate with: openssl rand -base64 32
jwt.secret=aG9zcGl0YWxCb29raW5nU2VjcmV0S2V5MjAyNkRldmVsb3BtZW50T25seQ==
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# BCrypt strength (12 is recommended)
security.password.strength=12

# =============================================================================
# EMAIL CONFIGURATION (Development - Console Output)
# =============================================================================
# Email will be logged to console in development
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Email sender details
app.email.from=noreply@hospital-booking.com
app.email.from-name=Hospital Booking System

# =============================================================================
# FILE UPLOAD CONFIGURATION
# =============================================================================
# Max file size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Upload directory
app.upload.dir=uploads/

# =============================================================================
# VALIDATION CONFIGURATION
# =============================================================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# =============================================================================
# CORS CONFIGURATION
# =============================================================================
# Allowed origins (Development: localhost:3000 for React)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# =============================================================================
# APPOINTMENT CONFIGURATION
# =============================================================================
# Appointment slot duration in minutes
app.appointment.slot-duration=30

# Maximum future booking days
app.appointment.max-future-days=90

# Minimum cancellation hours before appointment
app.appointment.min-cancellation-hours=24

# Maximum upcoming appointments per patient
app.appointment.max-upcoming-per-patient=5

# =============================================================================
# RATE LIMITING CONFIGURATION
# =============================================================================
# Authentication endpoints rate limit (requests per 15 minutes)
app.ratelimit.auth=5

# Public endpoints rate limit (requests per hour)
app.ratelimit.public=100

# Authenticated patient rate limit (requests per hour)
app.ratelimit.patient=1000

# Authenticated doctor rate limit (requests per hour)
app.ratelimit.doctor=2000

# Authenticated admin rate limit (requests per hour)
app.ratelimit.admin=5000

# =============================================================================
# APPLICATION METADATA
# =============================================================================
app.name=Hospital Booking System
app.version=1.0.0
app.description=Hospital Appointment Booking System API
app.environment=development

# =============================================================================
# ACTUATOR CONFIGURATION (Health Checks)
# =============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =============================================================================
# DEVELOPMENT HELPERS
# =============================================================================
# Disable Thymeleaf cache
spring.thymeleaf.cache=false

# Enable DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# =============================================================================
# NOTES FOR PRODUCTION
# =============================================================================
# 1. Change spring.jpa.hibernate.ddl-auto to 'validate' or 'none'
# 2. Disable H2 console (spring.h2.console.enabled=false)
# 3. Use MySQL database with proper credentials
# 4. Change JWT secret to a strong random key
# 5. Configure proper SMTP server for emails
# 6. Enable HTTPS only
# 7. Set logging.level.root=WARN
# 8. Disable SQL logging in production
# 9. Use environment variables for sensitive data
# 10. Enable production security headers
