# ---
# Hospital Booking System - Application Configuration
# ---
# Project: Hospital Appointment Booking System
# Student: Najm (2356070)
# Environment: Development
# Database: PostgreSQL (Neon Cloud)
# ---

# Application Name
spring.application.name=HospitalBookingAPI

# ---
# SERVER CONFIGURATION
# ---
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ---
# POSTGRESQL DATABASE CONFIGURATION (Neon Cloud)
# ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medibook}?sslmode=${DB_SSLMODE:require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:najm}
spring.datasource.password=${DB_PASSWORD:}

# ---
# JPA / HIBERNATE CONFIGURATION
# ---
# Hibernate DDL auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

# SQL Initialization (load data.sql after schema creation)
# Set to 'always' on first run, then change to 'never' to avoid duplicate inserts
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true

# Use SQL comments in logs
spring.jpa.properties.hibernate.use_sql_comments=true

# Hibernate dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable batch processing
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Enable second-level cache
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Show parameter values in SQL logs
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ---
# LOGGING CONFIGURATION
# ---
# Root logging level
logging.level.root=INFO

# Spring Framework logs
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Hibernate logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Application logs
logging.level.com.hospitalapp.backend=DEBUG

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ---
# SECURITY CONFIGURATION
# ---
# JWT Secret Key (Base64 encoded, minimum 256 bits for HS256)
# Loaded from environment variable for security
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=604800000

# BCrypt strength (12 is recommended)
security.password.strength=12

# ---
# EMAIL CONFIGURATION (SMTP)
# ---
# Default: Development mode (emails logged to console, not sent)
# For production, configure your SMTP provider below

# SMTP Server Configuration
# Common providers:
#   Gmail: smtp.gmail.com (port 587)
#   Outlook: smtp-mail.outlook.com (port 587)
#   Yahoo: smtp.mail.yahoo.com (port 587)
#   Mailtrap (testing): sandbox.smtp.mailtrap.io (port 587)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:najmarab37@gmail.com}
spring.mail.password=${SMTP_PASSWORD:}

# SMTP Authentication & Security
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Connection timeouts (milliseconds)
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Debug mode (set to true to see SMTP communication in logs)
spring.mail.properties.mail.debug=${MAIL_DEBUG:true}

# Email sender details
app.email.from=${MAIL_FROM:najmarab37@gmail.com}
app.email.from-name=${MAIL_FROM_NAME:Hospital Booking System}

# Email feature toggle (set to false to disable email sending)
# Note: Set to true when on a network that allows SMTP connections
app.email.enabled=${MAIL_ENABLED:true}

# ---
# FILE UPLOAD CONFIGURATION
# ---
# Max file size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Upload directory
app.upload.dir=uploads/

# ---
# GEMINI AI CONFIGURATION
# ---
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.0-flash

# ---
# VALIDATION CONFIGURATION
# ---
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ---
# CORS CONFIGURATION
# ---
# Allowed origins (Development: localhost:3000 for React)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ---
# APPOINTMENT CONFIGURATION
# ---
# Appointment slot duration in minutes
app.appointment.slot-duration=30

# Maximum future booking days
app.appointment.max-future-days=90

# Minimum cancellation hours before appointment
app.appointment.min-cancellation-hours=24

# Maximum upcoming appointments per patient
app.appointment.max-upcoming-per-patient=5

# ---
# RATE LIMITING CONFIGURATION
# ---
# Authentication endpoints rate limit (requests per 15 minutes)
app.ratelimit.auth=5

# Public endpoints rate limit (requests per hour)
app.ratelimit.public=100

# Authenticated patient rate limit (requests per hour)
app.ratelimit.patient=1000

# Authenticated doctor rate limit (requests per hour)
app.ratelimit.doctor=2000

# Authenticated admin rate limit (requests per hour)
app.ratelimit.admin=5000

# ---
# APPLICATION METADATA
# ---
app.name=Hospital Booking System
app.version=1.0.0
app.description=Hospital Appointment Booking System API
app.environment=development

# ---
# ACTUATOR CONFIGURATION (Health Checks)
# ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---
# DEVELOPMENT HELPERS
# ---
# Disable Thymeleaf cache
spring.thymeleaf.cache=false

# Enable DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ---
# NOTES FOR PRODUCTION
# ---
# 1. Change spring.jpa.hibernate.ddl-auto to 'validate' or 'none'
# 2. Use a dedicated PostgreSQL database with proper credentials
# 3. Change JWT secret to a strong random key
# 4. Configure proper SMTP server for emails
# 5. Enable HTTPS only
# 6. Set logging.level.root=WARN
# 7. Disable SQL logging in production
# 8. Use environment variables for sensitive data
# 9. Enable production security headers